    <!-- Favicon & Site Icons -->

    </noscript>

  <body style="background-color:#07080b;margin:0;padding:0;">
    <div id="root">
      <!-- Instant Initial Shell to eliminate white/blank screen phase (0ms FCP) -->
      <div style="background-color:#07080b;color:#f3ecd8;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;">
        <header style="height:72px;border-bottom:1px solid rgba(217,180,92,0.15);display:flex;align-items:center;justify-content:space-between;padding:0 24px;max-width:1280px;margin:0 auto;width:100%;box-sizing:border-box;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:40px;height:40px;border-radius:50%;background:rgba(217,180,92,0.2);border:1px solid rgba(217,180,92,0.4);"></div>
            <span style="font-weight:700;font-size:20px;letter-spacing:-0.5px;"><span style="color:#f3ecd8;">Truth</span> <span style="color:#d9b45c;">Quran</span></span>
          </div>
        </header>
        <main style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;">
          <div style="width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(217,180,92,0.25) 0%,rgba(7,8,11,0.8) 100%);border:2px solid #d9b45c;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
            <span style="color:#d9b45c;font-size:28px;">۞</span>
          </div>
          <h1 style="font-size:28px;margin:0 0 12px 0;color:#f3ecd8;font-weight:600;">Truth Quran Academy</h1>
          <p style="color:#c9c2ab;font-size:14px;margin:0;max-width:480px;">Loading online Quran virtual classroom...</p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
